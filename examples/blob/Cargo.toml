[package]
name = "commonware-blob"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
description = "Post blobs to a ZODA-backed data-availability rail alongside a consensus chain."
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/examples/blob"

[lints]
workspace = true

[features]
# Test helpers emitted by `impl_certificate_bls12381_multisig!`.
mocks = ["commonware-cryptography/mocks"]

[dependencies]
ark-bn254 = { version = "0.6.0", default-features = false, features = ["scalar_field", "std"] }
ark-ff = { version = "0.6.0", default-features = false, features = ["asm", "std"] }
bytes = { workspace = true, features = ["std"] }
clap.workspace = true
commonware-codec = { workspace = true, features = ["std"] }
commonware-coding.workspace = true
commonware-consensus.workspace = true
commonware-cryptography = { workspace = true, features = ["std"] }
commonware-formatting = { workspace = true, features = ["std"] }
commonware-parallel = { workspace = true, features = ["std"] }
commonware-utils = { workspace = true, features = ["std"] }
rand_core.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
commonware-collector.workspace = true
commonware-cryptography = { workspace = true, features = ["mocks", "std"] }
rand = { workspace = true, features = ["std_rng", "alloc"] }
rand_chacha.workspace = true
rayon.workspace = true

[[bin]]
name = "commonware-blob"
bench = false
